# Invisible Canvas configuration (Phase 1A).
# Every key is required and unknown keys are rejected, so typos fail loudly.
# See brain.md section 9 for what each setting is for.

[camera]
# Case-insensitive substring of the DirectShow device name.
# "python -m invisible_canvas devices" lists the names. Empty = use `index`.
match = "owl 4k"         # Kreo Owl 4K Pro: DirectShow name "Owl 4K PRO Camera" (D41)
index = 0
backend = "dshow"        # dshow | msmf | any
width = 1920
height = 1080
fps = 60                 # Kreo: MJPG 1920x1080 measured 60.1-60.5 fps (D42); the Brio had 30
fourcc = "MJPG"
# Exposure, applied and read back every time the camera opens (DirectShow only):
#   "manual"     lock it at exposure_value: 2^value seconds (-5 = 31 ms, -6 = 15.6 ms).
#                At 60 fps a frame lasts 16.7 ms, so -6 or shorter (D42). Brio 100: -5
#                held 30 fps; auto exposure dropped to ~15 fps in dim light (D24).
#   "auto"       hand exposure back to the camera.
#   "unchanged"  leave whatever the camera has (cameras without exposure control).
# If the camera does not confirm the setting, the tools stop (`camera` only warns).
exposure_mode = "manual"
exposure_value = -6
# Focus, applied and read back every time the camera opens (DirectShow only), same modes.
# Kreo Owl 4K Pro: 0..1023, autofocus on by default, hunting (719 -> 64 -> 499) and settling
# on a blurred value. Sharpest on projected checkerboards: 410 (night, 400 = 99 %) and 400 (2026-10-19
# 12:25, 410 = 95 %), so 400 (D42); re-measure if the
# camera-wall distance changes.
focus_mode = "manual"
focus_value = 400
# Gain (IAMVideoProcAmp), same modes. Kreo: 0..15, manual only; manual exposure leaves it at 0,
# too dark at 60 fps. 15: white 145.6, grey-128 canvas 54.4, 60 fps, noise sd 0.86 (D43).
gain_mode = "manual"
gain_value = 15

[projector]
# Substring of the display's EDID name or EDID id, or its GDI name (e.g. "DISPLAY2").
# Empty = automatic: the single non-primary display on a physical external
# connector (brain.md section 9.7). Never chosen by index.
match = ""
expected_width = 1280
expected_height = 720

[calibration]
# Corner targets are inset from the canvas edges by this fraction of width/height.
target_inset = 0.06

[validation]
grid_cols = 5
grid_rows = 4
grid_inset = 0.04
required_mean_px = 5.0
required_max_px = 12.0
stretch_mean_px = 3.0
stretch_max_px = 8.0
repeatability_mean_px = 2.0
repeatability_runs = 3
# Setup check limit (repeatability metric, camera px) for AUTOMATIC calibrations, whose corners are
# detections (~0.05 px repeatability) rather than clicks. Must not exceed repeatability_mean_px, which
# stays the limit for manual calibrations. 1.0 was evaluated and NOT adopted (brain.md D32): it separates
# 1-px from 2-px moves well, but the scene drifted past it within ~4.5 min untouched. Re-evaluate with
# `setupcheck --repeat 12 --interval 45` once the mounts are stable.
auto_setup_limit_px = 2.0

[surface]
# Measured width of the projected image on the surface. 0 = unknown (errors in px only).
width_mm = 0.0

[paths]
calibration = "data/calibration"
reports = "data/reports"

[ai]
# Phase 3A (brain.md D51, D52, section 9.11): the AI reads the selected writing (an image of the strokes) and
# summarizes / explains / simplifies / gives examples / asks questions / explores the topic. On by default
# (D57, user request 2026-10-26): `draw` shows the AI button; `draw --no-ai` switches it off for one session.
enabled = true
# D52: "local" = free, offline: a vision model served by Ollama on this laptop (install Ollama, then
# `ollama pull <local_model>`). "claude" = the Claude API, paid per request; credentials from the environment
# (ANTHROPIC_API_KEY), never from this file.
backend = "local"
local_model = "qwen3-vl:8b-instruct"   # the direct-answer variant (qwen3-vl:8b is the thinking one)
local_url = "http://127.0.0.1:11434"
# Claude backend only:
model = "claude-opus-5-5"
effort = "medium"          # the model's default; answer time is measured in acceptance test S2
max_tokens = 16000         # thinking counts towards it
timeout_s = 120.0          # the first local request also loads the model into GPU memory
fallbacks = true           # server-side refusal fallbacks
# D79: facts about this class the AI must use (the local model guessed the college "in Chennai, Tamil Nadu"); one
# sentence each, given with every request. Edit freely.
facts = ["Shri Shankaracharya Institute of Professional Management and Technology (SSIPMT) is in Raipur, Chhattisgarh, India."]

[smart_lines]
# D62 (brain.md section 9.15): Smart Lines, the LINES tool. Projector px on the 1280 x 720 canvas, above the toolbar
# (y < 648). The writing zone sits at the middle height, where hand tracking is best (bottom band losses: 9.12);
# DONE is right of it. The notes area (completed, numbered lines) is at the top left, below the page label; the
# scroll column (SCROLL UP / DOWN, the scroll track, a counter) is right of it. When the lines no longer fit, it
# scrolls. D64: the review bar takes the 68 px above the zone (the notes area must end above them). D71 (the user's
# mockup): the notes almost the canvas wide (an open PAGES or AI panel lies over their right part; the scroll column
# then stands beside it, D65), the zone wider.
zone = [32, 400, 1088, 590]
notes = [32, 48, 1172, 324]
line_height = 44
line_spacing = 6
numbering = "1."
# D64: the notes' typeset text (Windows font folder; drawn with Pillow). The review bar uses Segoe UI Semibold.
font = "segoeui.ttf"
text_size = 30

[voice]
# D75 (brain.md section 9.19): voice writing. VOICE on the toolbar opens the voice panel; what is said is written as typed
# text in the writing area of the whiteboard page. Speech to text: faster-whisper on this laptop (free, offline; step V0:
# base.en, 99 % of the words on the user's voice, 0.57 s per utterance with 2 CPU threads). Utterances end at a pause;
# frames quieter than gate_dbfs are not speech (the user at the mic -30 to -36 dBFS, other voices -45 to -63).
enabled = true
device = "Realtek"           # a part of the microphone's name ("" = Windows' default input): the jack mic (Headset)
model = "models/whisper/base.en"
threads = 1                  # wall test 1: 23 fps while transcribing with 2 (on battery); 1: 0.87 s per utterance
gate_dbfs = -42.0
pause_ms = 700
max_utterance_s = 15.0
commands = true
# D77: the local AI ([ai] local_model, only while the AI is on) corrects words the recognizer misheard ("Rachi" ->
# "Ranchi", "touchmail" -> "Taj Mahal"), in the voice worker, never the camera loop; commands are never sent. On the
# user's 15 recorded sentences 86.9 -> 93.5 % of the words, +0.37 s a sentence, no correct word changed.
fix = true
# Names and words to expect (wall test 1: "Pratik" -> "Pertik", "Invisible Canvas" -> "a visible catalyst"):
# given to the recognizer as text said before. Edit freely.
vocabulary = ["Pratik", "Vedant", "Jamshedpur", "Jharkhand", "Kritagya", "Invisible Canvas"]
# D79: more names for the AI fix only (it corrects what was heard towards them: "Navam Meish" -> "Navomesh", "Sri
# Shankar Shari" -> "Shri Shankaracharya"). Not given to the recognizer: on the 15 recorded sentences its accuracy fell
# from 91.6 to 86.9 % with them in its hint. Edit freely.
fix_words = ["Navomesh", "Shri Shankaracharya",
             "Navomesh is the name of our event; it is often misheard as Navam Meish, Novo Mish, Namo Maysh or No Miesh"]
# Left of the voice panel (300 px wide at the top right), below the page label, above the toolbar (y < 648).
area = [40, 60, 952, 632]
font = "segoeui.ttf"
text_size = 30
