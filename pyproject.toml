[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "invisible-canvas"
version = "0.1.0"
description = "Vision-based spatial interaction platform: turns a projected surface into an interactive workspace."
readme = "README.md"
# 3.12 only for now: keeps MediaPipe (P1) installable. See brain.md D1.
requires-python = ">=3.12,<3.13"
# Phase 1 (P0 Foundation) runtime dependencies. See brain.md section 9.4.
dependencies = [
    "numpy>=2.0,<3",
    # Exactly one OpenCV wheel (brain.md 9.4): contrib, because MediaPipe requires it (D33).
    # <5: MediaPipe does not pin OpenCV and OpenCV 5 is out.
    "opencv-contrib-python>=4.10,<5",
    # Phase 1D hand tracking (D33). The model file is downloaded separately into models/.
    "mediapipe>=1.1,<2",
    # D60: PDF pages rendered by PDFium (free: Apache-2.0 / BSD-3-Clause, no dependencies).
    # Tested with 4.30.0; <5: a new major version may change the API.
    "pypdfium2>=4.30,<5",
    # D64: Smart Lines text typeset in Segoe UI (OpenCV's fonts are ASCII only). Free (MIT-CMU); 12.3.0 was
    # already installed (through matplotlib) and is the version tested.
    "pillow>=12,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
# Phase 3A AI on selected writing (brain.md D51, section 9.11): optional, only needed for `draw --ai`.
ai = [
    "anthropic>=2.2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
